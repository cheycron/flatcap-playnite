AddonId: Flatcap_Slate_Desktop
Type: ThemeDesktop
InstallerManifestUrl: https://raw.githubusercontent.com/cheycron/flatcap-playnite/main/installer/Flatcap_Slate_Desktop.yaml
ShortDescription: A flat, dark Desktop theme with a restrained blue accent and checked text contrast.
Description: |-
    A dark Desktop theme built on Playnite 10.64's Default theme: a flat palette, one muted blue accent and a type scale from the Flatcap design system.
    Text, hover and focus states are checked against contrast targets by the project's build.
    No extensions or settings are needed. Tested with Playnite 10.64 on Windows, grid and details views.
